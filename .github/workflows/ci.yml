name: ci

on:
  push:
  pull_request:
  # The mutation job only. It is exploratory and never on the required path.
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      # --locked: a changed resolution fails instead of silently rewriting Cargo.lock.
      # The cargo xtask alias passes --locked too (.cargo/config.toml).
      - run: cargo check --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The repository-corpus test calls the same function as the
      # `cargo xtask mutants semantic` step below and takes as long, about
      # 150 seconds; it runs there once instead of twice. Locally,
      # `cargo test --workspace` still runs it.
      - run: cargo test --workspace --locked -- --skip the_repository_corpus_parses_and_has_no_active_mutant_that_is_not_caught
      # Integrity gate: every accepted research snapshot through the same
      # verify_snapshot the tests call (manifest, coverage, strict NDJSON,
      # schema, references, negative controls). Failures print a stable code.
      - run: cargo xtask research verify-all docs/research
      # Architecture gate: the dependency rule of ADR 0000 over declared and
      # resolved graphs. Violations print rule, packages, layers, and kind.
      - run: cargo xtask check-layers
      # Purity gate: crates/core/PURITY.toml over the core crates (ADR 0016).
      # No build script, no dependency outside the allowlist, no_std, panic
      # lints denied. Violations print a stable code, crate, and dependency.
      - run: cargo xtask check-core-purity
      # Every receipt names a registered check and claims passed only with
      # evidence of a run; every active semantic mutant is caught by its test.
      - run: cargo xtask receipts validate
      - run: cargo xtask mutants semantic

  # Every commit since the merge base declares the oracle it changes
  # (ADR 0015): a `Trust-Boundary:` line for specification or verifier
  # changes, no oracle mixed with implementation, and no undeclared escape
  # hatch. The base is chosen as for research-frozen below.
  trust-boundary:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
      - name: Oracle changes are declared
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.ref_name == github.event.repository.default_branch && github.event.before || format('origin/{0}', github.event.repository.default_branch)) }}
        run: cargo xtask check-trust-boundary --base "$BASE"

  # Accepted research snapshots never change; a revision is a new dated snapshot.
  # Checksums cannot catch a file and its manifest rewritten together, so this
  # runs on every event and compares against an accepted revision:
  #   pull request                -> the base branch
  #   push to the default branch  -> the previous head, github.event.before
  #   push to any other branch    -> the default branch
  # A base that cannot be resolved, such as a head rewritten by a force push,
  # fails the job. The freeze never passes a tree it could not compare.
  research-frozen:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
      - name: Accepted research snapshots are unchanged
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.ref_name == github.event.repository.default_branch && github.event.before || format('origin/{0}', github.event.repository.default_branch)) }}
        run: cargo xtask research frozen --base "$BASE"

  # Exploratory: cargo-mutants on a schedule or by hand, never on push or
  # pull request. It uploads its outcomes and gates nothing; a surviving
  # mutant is classified by a person (ADR 0015). The weekly run mutates only
  # the Rust lines changed in the last eight days, and nothing when none
  # changed; a run by hand mutates the whole workspace in four shards
  # (mutation-calibration record, 2026-09-30).
  mutation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ github.event_name == 'schedule' && fromJSON('[0]') || fromJSON('[0, 1, 2, 3]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Choose what to mutate
        id: scope
        run: |
          if [ "${{ github.event_name }}" = schedule ]; then
            base=$(git rev-list -n 1 --before="8 days ago" HEAD)
            [ -n "$base" ] || base=$(git rev-list --max-parents=0 HEAD | tail -n 1)
            git diff "$base" HEAD -- '*.rs' > "$RUNNER_TEMP/changed.diff"
            if [ -s "$RUNNER_TEMP/changed.diff" ]; then
              echo "args=--in-diff $RUNNER_TEMP/changed.diff" >> "$GITHUB_OUTPUT"
            else
              echo "No Rust line changed since $base; nothing to mutate."
              echo "args=" >> "$GITHUB_OUTPUT"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "args=--shard ${{ matrix.shard }}/4" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@master
        if: steps.scope.outputs.skip != 'true'
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
      - name: Install cargo-mutants
        if: steps.scope.outputs.skip != 'true'
        run: cargo install cargo-mutants --version 27.1.0 --locked
      - name: Mutate
        if: steps.scope.outputs.skip != 'true'
        run: cargo mutants --workspace --no-shuffle -j 2 ${{ steps.scope.outputs.args }} --output target/mutants
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.skip != 'true'
        with:
          name: mutants-out-${{ matrix.shard }}
          path: target/mutants/mutants.out

  # Advisory: reports prose and Markdown findings as warnings. Never fails the build.
  docs-lint:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Prebuilt release binary, checksum-verified: about a second, versus
      # minutes to compile from source. Too quick to be worth caching.
      - name: Install Vale
        id: install
        continue-on-error: true
        env:
          VALE_VERSION: 3.23.0
        run: |
          base="https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}"
          tarball="vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          mkdir -p "$RUNNER_TEMP/vale" && cd "$RUNNER_TEMP/vale"
          curl -sSfLO "$base/$tarball"
          curl -sSfLO "$base/vale_${VALE_VERSION}_checksums.txt"
          grep " ${tarball}\$" "vale_${VALE_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "$tarball" vale
          echo "$RUNNER_TEMP/vale" >> "$GITHUB_PATH"
      - name: Prose lint (Vale)
        id: vale
        continue-on-error: true
        run: .vale/lint.sh
      - name: Annotate prose findings
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          mapfile -t docs < <(git ls-files '*.md' ':!:.vale/fixtures/*')
          vale --no-exit --output=line "${docs[@]}" \
            | sed -E 's/^([^:]+):([0-9]+):([0-9]+):[^:]+:(.*)$/::warning file=\1,line=\2,col=\3::\4/'
      - name: Markdown lint
        id: markdownlint
        continue-on-error: true
        run: npx --yes markdownlint-cli2@0.23.3 "**/*.md"
      - name: Report
        if: always()
        run: |
          {
            echo "### Docs lint (advisory)"
            echo "| Check | Outcome |"
            echo "| --- | --- |"
            echo "| Vale install | ${{ steps.install.outcome }} |"
            echo "| Vale prose lint | ${{ steps.vale.outcome }} |"
            echo "| markdownlint | ${{ steps.markdownlint.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          for check in "vale-install=${{ steps.install.outcome }}" "vale=${{ steps.vale.outcome }}" "markdownlint=${{ steps.markdownlint.outcome }}"; do
            if [[ "${check#*=}" != "success" ]]; then
              echo "::warning title=Docs lint::${check%%=*} reported findings. Advisory only; see the job log."
            fi
          done
