name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      # --locked: a changed resolution fails instead of silently rewriting Cargo.lock.
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      # Accepted research snapshots verify as a whole: manifest, graph, schema.
      - run: cargo xtask research verify-all docs/research
      # The dependency rule of ADR 0000, over declared and resolved graphs.
      - run: cargo xtask check-layers

  # Accepted research snapshots never change; a revision is a new dated snapshot.
  research-frozen:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1 # keep in sync with rust-toolchain.toml
      - run: cargo xtask research frozen --base "origin/${{ github.base_ref }}"

  # Advisory: reports prose and Markdown findings as warnings. Never fails the build.
  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Prebuilt release binary, checksum-verified: about a second, versus
      # minutes to compile from source. Too quick to be worth caching.
      - name: Install Vale
        id: install
        continue-on-error: true
        env:
          VALE_VERSION: 3.23.0
        run: |
          base="https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}"
          tarball="vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          mkdir -p "$RUNNER_TEMP/vale" && cd "$RUNNER_TEMP/vale"
          curl -sSfLO "$base/$tarball"
          curl -sSfLO "$base/vale_${VALE_VERSION}_checksums.txt"
          grep " ${tarball}\$" "vale_${VALE_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "$tarball" vale
          echo "$RUNNER_TEMP/vale" >> "$GITHUB_PATH"
      - name: Prose lint (Vale)
        id: vale
        continue-on-error: true
        run: .vale/lint.sh
      - name: Annotate prose findings
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          mapfile -t docs < <(git ls-files '*.md' ':!:.vale/fixtures/*')
          vale --no-exit --output=line "${docs[@]}" \
            | sed -E 's/^([^:]+):([0-9]+):([0-9]+):[^:]+:(.*)$/::warning file=\1,line=\2,col=\3::\4/'
      - name: Markdown lint
        id: markdownlint
        continue-on-error: true
        run: npx --yes markdownlint-cli2@0.23.3 "**/*.md"
      - name: Report
        if: always()
        run: |
          {
            echo "### Docs lint (advisory)"
            echo "| Check | Outcome |"
            echo "| --- | --- |"
            echo "| Vale install | ${{ steps.install.outcome }} |"
            echo "| Vale prose lint | ${{ steps.vale.outcome }} |"
            echo "| markdownlint | ${{ steps.markdownlint.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          for check in "vale-install=${{ steps.install.outcome }}" "vale=${{ steps.vale.outcome }}" "markdownlint=${{ steps.markdownlint.outcome }}"; do
            if [[ "${check#*=}" != "success" ]]; then
              echo "::warning title=Docs lint::${check%%=*} reported findings. Advisory only; see the job log."
            fi
          done
