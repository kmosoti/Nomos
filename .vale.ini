# Prose linting for Nomos docs. Rules: .vale/styles/Kennedy/
# Style source of truth: docs/style/prose-spec.yaml
StylesPath = .vale/styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = Kennedy
# Skip inline and display math.
TokenIgnores = (\$\$[^$]+\$\$), (\$[^$\n]+\$)

# Imported research snapshots are evidence and stay byte for byte as received.
# Rewriting them to satisfy the linter would falsify their checksums.
[docs/research/*/snapshot/*.md]
BasedOnStyles =
