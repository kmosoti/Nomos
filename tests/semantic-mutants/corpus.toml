# Semantic-mutant corpus. Format and meaning in README.md; run with
# `cargo xtask mutants semantic`. A mutant becomes active, with a patch under
# patches/, in the milestone that lands its kernel, and the named test must
# fail against it before the milestone is complete. Every mutant here is
# active: the Assessment, Warp, and Transition Kernels' and the Canon
# artifact's (`06-canon-artifact`).

[[mutant]]
id = "SM-ASSESS-001"
property = "N13"
threat = "a failed Observation is reported as a Variance"
wrong_behavior = "assess returns Variance when the Observation carries no evidence"
crate = "nomos-core"
patch = "patches/SM-ASSESS-001.diff"
test = "assessment::tests::a_failed_observation_is_indeterminate"
status = "active"

[[mutant]]
id = "SM-ASSESS-002"
property = "N13"
threat = "an Indeterminate Assessment feeds the Plan"
wrong_behavior = "plan input includes Indeterminate Assessments alongside Variances"
crate = "nomos-core"
patch = "patches/SM-ASSESS-002.diff"
test = "assessment::tests::indeterminate_assessments_do_not_reach_the_plan"
status = "active"

[[mutant]]
id = "SM-ASSESS-003"
property = "N3"
threat = "a converged host is planned for"
wrong_behavior = "assess treats a matching Observation as a Variance when its collection window closed before a fixed instant; freshness is a policy applied before assessment, never inside it"
crate = "nomos-core"
patch = "patches/SM-ASSESS-003.diff"
test = "assessment::tests::a_matching_observation_is_satisfied_whatever_its_age"
status = "active"

[[mutant]]
id = "SM-WARP-001"
property = "N4"
threat = "an Action runs before a hard dependency succeeded"
wrong_behavior = "the execution frontier admits an Action whose requires edge points at a Failed Action"
crate = "nomos-warp"
patch = "patches/SM-WARP-001.diff"
test = "frontier::tests::a_failed_requirement_blocks_the_dependent"
status = "active"

[[mutant]]
id = "SM-WARP-002"
property = "N4"
threat = "an after edge is treated as a requires edge, or the reverse"
wrong_behavior = "an after edge from a source that ended other than Succeeded keeps its dependent Waiting forever"
crate = "nomos-warp"
patch = "patches/SM-WARP-002.diff"
test = "frontier::tests::a_failed_after_edge_does_not_block"
status = "active"

[[mutant]]
id = "SM-WARP-003"
property = "N4"
threat = "a cyclic Plan is executed"
wrong_behavior = "cycle detection ignores after edges, so an after cycle compiles"
crate = "nomos-warp"
patch = "patches/SM-WARP-003.diff"
test = "graph::tests::a_cycle_through_after_edges_is_rejected"
status = "active"

[[mutant]]
id = "SM-WARP-004"
property = "N10"
threat = "a failed or unknown trigger is read as no change, so a refresh is Skipped and what requires it runs"
wrong_behavior = "resolve_group counts an on_change source that is not met toward Disabled instead of Blocked"
crate = "nomos-warp"
patch = "patches/SM-WARP-004.diff"
test = "frontier::tests::a_failed_trigger_blocks_the_refresh_and_what_requires_it"
status = "active"

[[mutant]]
id = "SM-WARP-005"
property = "N10"
threat = "a refresh loads an input whose write failed or may still be running"
wrong_behavior = "resolve_group activates the group when one source changed, even beside a source that is not met"
crate = "nomos-warp"
patch = "patches/SM-WARP-005.diff"
test = "frontier::tests::a_changed_source_beside_a_failed_one_does_not_activate"
status = "active"

[[mutant]]
id = "SM-TRANSITION-001"
