# Semantic-mutant corpus. Format and meaning in README.md; run with
# `cargo xtask mutants semantic`. Every mutant here is planned: the kernels it
# would mutate do not exist yet. Each becomes active, with a patch under
# patches/, in the milestone that lands its kernel, and the named test must
# fail against it before the milestone is complete.

[[mutant]]
id = "SM-ASSESS-001"
property = "N13"
threat = "a failed Observation is reported as a Variance"
wrong_behavior = "assess returns Variance when the Observation carries no evidence"
crate = "nomos-core"
patch = "patches/SM-ASSESS-001.diff"
test = "assessment::tests::a_failed_observation_is_indeterminate"
status = "planned"

[[mutant]]
id = "SM-ASSESS-002"
property = "N13"
threat = "an Indeterminate Assessment feeds the Plan"
wrong_behavior = "plan input includes Indeterminate Assessments alongside Variances"
crate = "nomos-core"
patch = "patches/SM-ASSESS-002.diff"
test = "assessment::tests::indeterminate_assessments_do_not_reach_the_plan"
status = "planned"

[[mutant]]
id = "SM-ASSESS-003"
property = "N3"
threat = "a converged host is planned for"
wrong_behavior = "assess treats an Observation equal to the Condition as a Variance when its provenance is older than the Condition"
crate = "nomos-core"
patch = "patches/SM-ASSESS-003.diff"
test = "assessment::tests::a_matching_observation_is_satisfied_whatever_its_age"
status = "planned"

[[mutant]]
id = "SM-WARP-001"
property = "N4"
threat = "an Action runs before a hard dependency succeeded"
wrong_behavior = "the execution frontier admits an Action whose requires edge points at a Failed Action"
crate = "nomos-warp"
patch = "patches/SM-WARP-001.diff"
test = "frontier::tests::a_failed_requirement_blocks_the_dependent"
status = "planned"

[[mutant]]
id = "SM-WARP-002"
property = "N4"
threat = "an after edge is treated as a requires edge, or the reverse"
wrong_behavior = "the frontier blocks on an after edge whose source failed"
crate = "nomos-warp"
patch = "patches/SM-WARP-002.diff"
test = "frontier::tests::a_failed_after_edge_does_not_block"
status = "planned"

[[mutant]]
id = "SM-WARP-003"
property = "N4"
threat = "a cyclic Plan is executed"
wrong_behavior = "cycle detection ignores after edges, so an after cycle compiles"
crate = "nomos-warp"
patch = "patches/SM-WARP-003.diff"
test = "graph::tests::a_cycle_through_after_edges_is_rejected"
status = "planned"

[[mutant]]
id = "SM-TRANSITION-001"
property = "N6"
threat = "an Action succeeds without verified postconditions"
wrong_behavior = "the lifecycle admits Running to Succeeded without passing through Verifying"
crate = "nomos-core"
patch = "patches/SM-TRANSITION-001.diff"
test = "action::tests::succeeded_requires_verifying"
status = "planned"

[[mutant]]
id = "SM-TRANSITION-002"
property = "N10"
threat = "a timed-out Action is assumed to have failed"
wrong_behavior = "TimedOut transitions to Failed instead of forcing re-observation"
crate = "nomos-core"
patch = "patches/SM-TRANSITION-002.diff"
test = "action::tests::timed_out_stays_unknown"
status = "planned"

[[mutant]]
id = "SM-TRANSITION-003"
property = "N5"
threat = "a stale fenced Plan executes"
wrong_behavior = "the generation check accepts a Plan whose generation equals the highest accepted one minus one"
crate = "nomos-core"
patch = "patches/SM-TRANSITION-003.diff"
test = "plan::tests::a_stale_generation_is_rejected"
status = "planned"
