# Semantic-mutant corpus. Format and meaning in README.md; run with
# `cargo xtask mutants semantic`. A mutant becomes active, with a patch under
# patches/, in the milestone that lands its kernel, and the named test must
# fail against it before the milestone is complete. Every mutant here is
# active: the Assessment, Warp, and Transition Kernels', the Canon
# artifact's (`06-canon-artifact`), the controller-composition
# experiment's, the Substrate adapter's (`07-substrate-conformance`), the
# resource families' (`08-resource-families`), the Linux files and
# directories' and the content store's (`09-file-and-directory`), the
# durable log's (`10-durable-cell`), the systemd units' on Debian
# (`11-systemd-unit`), the kernel parameters' and users'
# (`12-sysctl-and-user`), the packages' (`13-package`), and the Cell
# commands' (`14-cell-commands`). A patch is regenerated
# against the code it mutates when that code moves, with the same wrong
# behavior; the 08 regenerations are named in the milestone's record.

