threat = "trace shows an Action for a resource the kernel planned nothing for, so an operator acts on an unknown"
wrong_behavior = "trace prints converge for a resource without a planned Action"
crate = "nomos-cell"
patch = "patches/SM-CELL-001.diff"
test = "trace_plans_nothing_for_an_indeterminate_resource_and_executes_nothing"
status = "active"

[[mutant]]
id = "SM-CELL-002"
property = "N5"
threat = "every enforce after the first is fenced out, so a Cell converges once and never again"
wrong_behavior = "enforce gives every Plan generation 1, whatever the journal's fence accepted"
crate = "nomos-cell"
patch = "patches/SM-CELL-002.diff"
test = "trace_changes_nothing_and_enforce_converges_to_a_fixed_point"
status = "active"
host = "debian"
target = "cell_commands"

[[mutant]]
id = "SM-CELL-003"
property = "N13"
threat = "a run that could not see what it manages reports success to the timer or operator that started it"
wrong_behavior = "an Indeterminate outcome exits with status 0"
crate = "nomos-cell"
patch = "patches/SM-CELL-003.diff"
test = "render::tests::each_outcome_exits_with_the_status_the_table_names"
status = "active"

[[mutant]]
id = "SM-CELL-004"
property = "N2"
threat = "the kernel's clock stays at zero, so every settle-by instant is already past and every unit job is cancelled"
wrong_behavior = "enforce steps the Enforce input without a Tick of the host's clock"
crate = "nomos-cell"
patch = "patches/SM-CELL-004.diff"
test = "trace_changes_nothing_and_enforce_converges_to_a_fixed_point"
status = "active"
host = "debian"
target = "cell_commands"

[[mutant]]
id = "SM-CELL-005"
property = "N7"
threat = "two Cell processes mutate one state directory, so one's rollback truncates Events the other acknowledged and both issue effects from different snapshots"
wrong_behavior = "enforce does not take the state directory's lease"
crate = "nomos-cell"
patch = "patches/SM-CELL-005.diff"
test = "enforce_is_refused_while_another_process_holds_the_state"
status = "active"

[[mutant]]
id = "SM-CELL-006"
property = "N7"
threat = "mutation authority ends before the mutation does, so a second process can write the journal while the first is still writing it"
wrong_behavior = "enforce takes the lease and releases it at once"
crate = "nomos-cell"
patch = "patches/SM-CELL-006.diff"
test = "the_lease_is_held_for_the_whole_run"
status = "active"

[[mutant]]
id = "SM-CELL-007"
property = "N1"
threat = "trace changes the Cell's persistent state: opening a journal for inspection repairs it"
wrong_behavior = "trace and events open the journal with the repairing open, truncating a torn tail and creating an absent journal"
crate = "nomos-cell"
patch = "patches/SM-CELL-007.diff"
test = "a_torn_journal_is_not_repaired_by_trace_or_events"
status = "active"

[[mutant]]
id = "SM-STORE-005"
property = "state-trust"
threat = "the Cell trusts a state directory a group can write, so a group member decides what the Cell does to the host"
wrong_behavior = "the safety check refuses an object open to others but not one open to its group"
crate = "nomos-store-fs"
patch = "patches/SM-STORE-005.diff"
test = "state::tests::a_state_directory_open_to_group_or_others_is_refused"
status = "active"

[[mutant]]
id = "SM-STORE-006"
property = "state-trust"
threat = "the state directory is a link to a place the Cell did not make, which the Cell then trusts"
wrong_behavior = "the state directory is opened following a symbolic link"
crate = "nomos-store-fs"
patch = "patches/SM-STORE-006.diff"
test = "state::tests::a_state_directory_that_is_a_link_is_refused"
status = "active"

[[mutant]]
id = "SM-STORE-007"
property = "state-trust"
threat = "the Cell replays a journal that is a link, a device, or open to others"
wrong_behavior = "the journal is opened without the safety check"
crate = "nomos-cell"
patch = "patches/SM-STORE-007.diff"
test = "an_unsafe_journal_or_content_store_is_refused_before_replay"
status = "active"
