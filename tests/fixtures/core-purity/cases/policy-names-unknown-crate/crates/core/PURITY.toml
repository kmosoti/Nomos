# Negative control: the policy lists a crate the workspace does not have.
[policy]
no_std = true
build_scripts = false
required_lints = ["clippy::unwrap_used", "clippy::expect_used", "clippy::panic", "clippy::todo", "clippy::unimplemented"]

[crates.nomos-core]
[crates.nomos-canon]
[crates.nomos-ghost]

[allow.serde]
default_features = false
features = ["alloc", "derive"]
transitive = ["serde_derive"]
reason = "fixture"

[deny]
async-runtime = ["tokio"]
randomness = ["rand"]
