# Negative control: the policy allows a crate that its own [deny] names. No
# core crate depends on it; the contradiction alone is rejected.
[policy]
no_std = true
build_scripts = false
required_lints = ["clippy::unwrap_used", "clippy::expect_used", "clippy::panic", "clippy::todo", "clippy::unimplemented"]

[crates.nomos-core]
[crates.nomos-canon]

[allow.serde]
default_features = false
features = ["alloc", "derive"]
transitive = ["serde_derive"]
reason = "fixture: the one allowed external dependency"

[allow.rand]
default_features = false
reason = "fixture: an allow entry for a crate in a denied class"

[deny]
async-runtime = ["tokio"]
randomness = ["rand"]
