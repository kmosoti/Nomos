# Case adapter-own-port-target: forbidden: the adapter's own port is declared only for Windows, so a Linux build has no dependency on the port it implements.
[package]
name = "nomos-substrate-linux"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
nomos-core = { path = "../../core/nomos-core" }

[target.'cfg(windows)'.dependencies]
nomos-substrate = { path = "../../ports/nomos-substrate" }
