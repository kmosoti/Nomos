[workspace]
resolver = "3"
members = [
    # Hexagon core: domain model and pure domain services.
    "crates/core/nomos-core",
    "crates/core/nomos-canon",
    "crates/core/nomos-warp",
    # Driven ports: contracts the application depends on.
    "crates/ports/nomos-substrate",
    "crates/ports/nomos-store",
    "crates/ports/nomos-cipher",
    "crates/ports/nomos-mesh",
    "crates/ports/nomos-protocol",
    # Application: use cases orchestrating domain through ports.
    "crates/app/nomos-app",
    # Driven adapters: concrete implementations of ports.
    "crates/adapters/nomos-substrate-linux",
    "crates/adapters/nomos-substrate-mock",
    "crates/adapters/nomos-store-fs",
    "crates/adapters/nomos-cipher-vault",
    "crates/adapters/nomos-mesh-headscale",
    # Driving adapters and composition roots.
    "crates/bin/nomos-cell",
    "crates/bin/nomos-loom",
    # Development tooling, invoked as `cargo xtask` (ADR 0003).
    "crates/bin/nomos-xtask",
]

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"
repository = "https://github.com/kmosoti/nomos"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# `cfg(kani)` guards the bounded-verifier harnesses; cargo kani sets it.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
# Core
nomos-core = { path = "crates/core/nomos-core" }
nomos-canon = { path = "crates/core/nomos-canon" }
nomos-warp = { path = "crates/core/nomos-warp" }
# Ports
nomos-substrate = { path = "crates/ports/nomos-substrate" }
nomos-store = { path = "crates/ports/nomos-store" }
nomos-cipher = { path = "crates/ports/nomos-cipher" }
nomos-mesh = { path = "crates/ports/nomos-mesh" }
nomos-protocol = { path = "crates/ports/nomos-protocol" }
# Application
nomos-app = { path = "crates/app/nomos-app" }
# Adapters
nomos-substrate-linux = { path = "crates/adapters/nomos-substrate-linux" }
nomos-substrate-mock = { path = "crates/adapters/nomos-substrate-mock" }
nomos-store-fs = { path = "crates/adapters/nomos-store-fs" }
nomos-cipher-vault = { path = "crates/adapters/nomos-cipher-vault" }
nomos-mesh-headscale = { path = "crates/adapters/nomos-mesh-headscale" }
# Tooling. Used by nomos-xtask; never as a normal dependency of a domain, port,
# app, or adapter crate. `serde` is also the typed-validation negative control's
# derive, a dev-dependency of nomos-canon (milestone 06).
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
jsonschema = { version = "0.58", default-features = false }
toml = "1"
# Testing. Dev-dependencies only; exempt from the core purity policy (ADR 0016).
proptest = { version = "1", default-features = false, features = ["std"] }
trybuild = "1"
# System calls for the Linux Substrate adapter (milestone 07): openat2 with
# resolve flags, and the monotonic clock, through safe wrappers, because the
# workspace forbids `unsafe`. Adapters only; the core purity policy denies it.
rustix = { version = "1", default-features = false, features = ["std", "fs", "time"] }
# systemd's D-Bus API for the Linux Substrate's units (milestone 11): a
# pure-Rust client, through its blocking API, since the port is synchronous
# (Phase 1 plan, decision 2). Adapters only.
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
# Independent references for the Canon IR (milestone 06). Dev-dependencies
# only: the encoders and the hash under test are written without them.
ciborium = "0.2"
serde_json_canonicalizer = "0.3"
