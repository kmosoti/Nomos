# The check registry. A verification receipt names one of these by `check_id`,
# and its `command` must begin with the registered command up to the first
# `<placeholder>`. A result of `passed` is recordable only for a check that is
# here and was run. Adding a check is a verifier change (AGENTS.md rule 11).

[checks.cargo-fmt]
command = "cargo fmt --all --check"
what = "formatting"

[checks.cargo-check]
command = "cargo check --workspace --locked"
what = "the workspace compiles with the locked resolution"

[checks.cargo-clippy]
command = "cargo clippy --workspace --all-targets --locked -- -D warnings"
what = "lints, warnings as errors"

[checks.cargo-test]
command = "cargo test --workspace --locked"
what = "unit and integration tests, the gates' negative controls included"

[checks.research-verify-all]
command = "cargo xtask research verify-all docs/research"
what = "every accepted research snapshot: manifest, coverage, strict NDJSON, schema, references, negative controls"

[checks.research-frozen]
command = "cargo xtask research frozen --base <ref>"
what = "no accepted research snapshot changed since the merge base"

[checks.check-layers]
command = "cargo xtask check-layers"
what = "the dependency rule of ADR 0000 over declared and resolved graphs"

[checks.check-core-purity]
command = "cargo xtask check-core-purity"
what = "the core purity policy of ADR 0016 over crates/core/"

[checks.check-canon-build]
command = "cargo xtask check-canon-build"
what = "a Canon crate's build runs no procedural macro and no build script (canon-ir.md, Provenance)"

[checks.check-trust-boundary]
command = "cargo xtask check-trust-boundary --base <ref>"
what = "every commit since the merge base declares its oracle changes (ADR 0015)"

[checks.receipts-validate]
command = "cargo xtask receipts validate"
what = "every receipt is well formed and names an executed, registered check"

[checks.mutants-semantic]
command = "cargo xtask mutants semantic"
what = "every active semantic mutant is caught by its named test"

[checks.kani]
command = "cargo kani"
what = "every bounded-verifier harness under cfg(kani) verifies with its cover checks satisfied; needs cargo-kani installed"

[checks.mutants-calibration]
command = "cargo mutants"
what = "cargo-mutants over a named target; results are classified by hand, not scored"

[checks.tlc]
command = "java -cp <jar> tlc2.TLC"
what = "the TLA+ model checker on a model and configuration under formal/tla/; a result about the model within its bounds, never a proof of the Rust; a negative-control configuration must fail"

[checks.hermeticity]
command = "cargo xtask hermeticity"
what = "experiment build-hermeticity: two isolated builds of the Canon authoring crate give identical IR, and every undeclared input is denied or recorded; needs strace, unshare, and valgrind, and fails without them"

[checks.generator-variance]
command = "cargo xtask generator-variance"
what = "experiment generator-variance: each candidate against its own tests, the fixed nomos-core oracle, and the SM-ASSESS mutants of the reference, with a generated-input comparison; exploratory, never gating; passes when the negative control is own-tests-accepted and oracle-rejected"

[checks.debian]
command = "cargo xtask debian"
what = "the Linux suites, built as static binaries, pass as root in a fresh privileged Debian container of the named release with systemd as PID 1; needs Docker and the musl target, and fails without them"

[checks.package]
command = "cargo xtask package"
what = "the Cell's Debian package builds: a static binary, its service and timer, and its maintainer scripts; whether it installs is the debian check's"

[checks.check-evidence-tests]
command = "cargo xtask check-evidence-tests"
what = "every evidence-bearing test the semantic-mutant corpus names is protected by its path or its pin, and the oracle map is the one they generate (verification-strategy.md, Test Taxonomy)"

[checks.check-workflow-pins]
command = "cargo xtask check-workflow-pins"
what = "every action in the workflows is pinned to a full commit SHA"

[checks.debian-minimal]
command = "cargo xtask debian-minimal"
what = "the Cell's package, installed alone on a Debian base image, brings everything the Cell runs and converges the demonstration Canon; with --control omit-systemd, the package without its dependency on systemd cannot boot the host"
